name: SST Deploy
on:
  push:
    branches:
      - main

# Concurrency group name ensures concurrent workflow runs wait for any in-progress job to finish
concurrency:
  group: merge-${{ github.ref }}

permissions: write-all

jobs:
  DeployApp:
    runs-on: ubuntu-latest
    env:
      SMTP_CONFIG: ${{ secrets.SMTP_CONFIG }}
      SST_PRINT_LOGS: 1
      SST_STAGE: prod
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::912982098059:role/GitHubDeploy
          role-duration-seconds: 3600
          aws-region: us-east-2
      - name: Install Dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --ws
      - name: Set Secret
        run: ./node_modules/.bin/sst secret set SMTP_CONFIG ${{ secrets.SMTP_CONFIG }}
      - name: Deploy app
        run: |
          ./node_modules/.bin/sst deploy --stage prod
      - name: Run Pa11y CI
        run:  
          npx pa11y-ci --sitemap https://danklco.com/sitemap-index.xml --config .pa11yci
      - name: Page Speed Insights
        uses: jakepartusch/psi-action@v1.3
        with:
          url: https://danklco.com
          threshold: 70
          strategy: mobile
          key: ${{ secrets.PSI_API_KEY }}